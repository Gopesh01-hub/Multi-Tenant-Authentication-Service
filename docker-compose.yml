services:
  app:
    build: .
    container_name: identity-platform
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: identity_secret
      JWT_SECRET: bXktc3VwZXItc2VjcmV0LWtleS1mb3ItaWRlbnRpdHktcGxhdGZvcm0tand0LXNpZ25pbmc=
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - identity-net

  postgres:
    image: postgres:16-alpine
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_admin
      POSTGRES_PASSWORD: identity_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_admin -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - identity-net

  redis:
    image: redis:7-alpine
    container_name: identity-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - identity-net

volumes:
  postgres_data:
  redis_data:

networks:
  identity-net:
    driver: bridge
